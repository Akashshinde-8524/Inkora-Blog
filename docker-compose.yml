version: '3.8'

services:
  # ---------------------------------------------------------
  # 1. MySQL 8 Database
  # ---------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: inkora_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-inkora_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_super_secret}
      MYSQL_USER: ${MYSQL_USER:-inkora_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-inkora_secret_password}
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_super_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inkora_net

  # ---------------------------------------------------------
  # 2. Spring Boot 3 Backend API
  # ---------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inkora_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-inkora_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-inkora_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-inkora_secret_password}
      JPA_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-InkoraUltraSecureSuperSecretKeyForSigningJWTTokens9876543210InkoraApp}
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    networks:
      - inkora_net

  # ---------------------------------------------------------
  # 3. React Vite Frontend + Nginx Web Server
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inkora_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - inkora_net

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  inkora_net:
    driver: bridge
