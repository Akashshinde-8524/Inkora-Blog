server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: inkora-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/inkora_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

# Inkora Application Properties
inkora:
  app:
    jwtSecret: ${JWT_SECRET:InkoraUltraSecureSuperSecretKeyForSigningJWTTokens9876543210InkoraApp}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-file-size: 10485760 # 10MB in bytes
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
